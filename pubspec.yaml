name: noah
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.0.0  # Compatible with Dart 3.0.0
  mobile_scanner: ^3.0.0  # Compatible with Dart 3.0.0
  flutter_riverpod: ^2.0.0  # Compatible with Dart 3.0.0
  http: ^1.0.0
