  intl: ^0.18.0
  awesome_snackbar_content: ^0.1.0
  shimmer: ^3.0.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
