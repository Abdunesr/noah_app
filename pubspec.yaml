name: noah
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  
  # image_picker: 1.2.3 requires Dart >=3.10.0 → Use 1.1.2
  image_picker: ^1.1.2
  
  # mobile_scanner: 7.4.0 requires Dart >=3.7.0 → Use 3.0.0
  mobile_scanner: ^3.0.0
  
  # flutter_riverpod: 3.4.1 requires Dart >=3.7.0 → Use 2.5.1
  flutter_riverpod: ^2.5.1
  
  http: ^1.6.0
  
  # shared_preferences: 2.5.5 requires Dart >=3.9.0 → Use 2.2.3
  shared_preferences: ^2.2.3
  
  qr_flutter: ^4.1.0
  equatable: ^2.1.0
  go_router: ^17.3.0
  
  # permission_handler: 12.0.3 requires Dart >=3.10.0 → Use 11.3.1
  permission_handler: ^11.3.1
  
  # intl: MUST be 0.19.0 to match flutter_localizations
  intl: ^0.19.0
  
  awesome_snackbar_content: ^0.1.1
  shimmer: ^3.0.0
  
  # share_plus: 13.3.0 requires Dart >=3.10.0 → Use 10.0.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints: 4.0.0 requires Dart >=3.8.0 → Use 3.0.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
