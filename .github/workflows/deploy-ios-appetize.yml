name: Deploy iOS to Appetize

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Clean everything
        run: |
          flutter clean
          rm -rf ~/.pub-cache/hosted/pub.dev/flutter_riverpod-*
          rm -rf ~/.pub-cache/hosted/pub.dev/riverpod-*
          rm -rf pubspec.lock
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Install project dependencies
        run: |
          flutter pub get
          flutter pub add flutter_riverpod:2.4.0 --exact

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS Simulator app
        run: flutter build ios --debug --simulator --no-codesign -v

      - name: Create .zip for Appetize
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../app-simulator.zip Runner.app

      - name: Upload to Appetize.io
        id: upload
        run: |
          RESPONSE=$(curl --silent --http1.1 \
            -F "file=@app-simulator.zip" \
            -F "platform=ios" \
            "https://api.appetize.io/v2/apps?token=${{ secrets.APPETIZE_API_TOKEN }}")
          
          PUBLIC_KEY=$(echo $RESPONSE | jq -r '.publicKey')
          APP_URL="https://appetize.io/app/${PUBLIC_KEY}"
          
          echo "app-url=${APP_URL}" >> $GITHUB_OUTPUT

      - name: Comment PR with preview link
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 📱 iOS Preview
            Test this build in your browser: ${{ steps.upload.outputs.app-url }}
            _Built from commit ${{ github.sha }}_
